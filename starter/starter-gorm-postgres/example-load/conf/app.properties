spring.gorm.postgres.instances.load.host=127.0.0.1
spring.gorm.postgres.instances.load.port=5432
spring.gorm.postgres.instances.load.user=postgres
spring.gorm.postgres.instances.load.password=root
spring.gorm.postgres.instances.load.db=load
spring.gorm.postgres.instances.load.sslmode=disable

# Governance rules live in their OWN file, watched live by starter-governance's
# file source. Edit conf/govern.properties while the app runs and the policy
# changes without a restart (and without an app-wide property re-bind).
govern.source.file.path=conf/govern.properties
