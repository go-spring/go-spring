spring.gorm.postgres.instances.primary.host=127.0.0.1
spring.gorm.postgres.instances.primary.port=5432
spring.gorm.postgres.instances.primary.user=postgres
spring.gorm.postgres.instances.primary.password=123456
spring.gorm.postgres.instances.primary.db=test
spring.gorm.postgres.instances.primary.sslmode=disable
# Connection pool tuning, startup fail-fast ping timeout, and slow-query logging.
spring.gorm.postgres.instances.primary.max-open-conns=10
spring.gorm.postgres.instances.primary.max-idle-conns=5
spring.gorm.postgres.instances.primary.conn-max-lifetime=30m
spring.gorm.postgres.instances.primary.conn-max-idle-time=5m
spring.gorm.postgres.instances.primary.ping-timeout=5s
spring.gorm.postgres.instances.primary.slow-threshold=200ms
# TLS is negotiated through sslmode (disabled here; smoke DB is plaintext). To
# enable a verifying connection, set sslmode=verify-full and supply certs:
# spring.gorm.postgres.instances.primary.sslmode=verify-full
# spring.gorm.postgres.instances.primary.sslrootcert=/path/ca.pem
# spring.gorm.postgres.instances.primary.sslcert=/path/client-cert.pem
# spring.gorm.postgres.instances.primary.sslkey=/path/client-key.pem

spring.gorm.postgres.instances.replica.host=127.0.0.1
spring.gorm.postgres.instances.replica.port=5432
spring.gorm.postgres.instances.replica.user=postgres
spring.gorm.postgres.instances.replica.password=123456
spring.gorm.postgres.instances.replica.db=test
spring.gorm.postgres.instances.replica.sslmode=disable

# This instance resolves its address via service discovery. `host`/`port` are
# dummies on purpose — they are ignored because `service-name` is set, proving
# the address comes from the registered discovery backend (see discovery.go).
# `port` still has to parse as a valid TCP port for the pgx DSN parser, so it is
# a plausible value rather than 0.
spring.gorm.postgres.instances.discovery.host=0.0.0.0
spring.gorm.postgres.instances.discovery.port=5432
spring.gorm.postgres.instances.discovery.user=postgres
spring.gorm.postgres.instances.discovery.password=123456
spring.gorm.postgres.instances.discovery.db=test
spring.gorm.postgres.instances.discovery.sslmode=disable
spring.gorm.postgres.instances.discovery.service-name=postgres-cluster

# Observability: OTLP gRPC trace exporter -> Jaeger on :4317.
spring.observability.enable=true
spring.observability.service-name=gorm-postgres-otel-example
spring.observability.trace.exporter=otlp-grpc
spring.observability.trace.endpoint=127.0.0.1:4317
spring.observability.trace.insecure=true
spring.observability.trace.sampler-ratio=1.0

spring.observability.metrics.exporter=prometheus
spring.observability.metrics.port=9090
spring.observability.metrics.path=/metrics

# The discovery backend bean name (a named discovery.Discovery bean
# registered in init) that resolves this instance's service-name.
spring.gorm.postgres.instances.discovery.discovery=default
