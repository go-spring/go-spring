# Disable the built-in HTTP server; probes are served by the actuator.
spring.http.server.enabled=false

# --- Discovery -------------------------------------------------------------
# The "primary" instance's address is resolved through the "default" discovery
# backend (registered in example.go as a static backend pointing at 127.0.0.1:5432)
# rather than hardcoded config — a query succeeds only if resolve -> dial works.
spring.gorm.postgres.primary.host=127.0.0.1
spring.gorm.postgres.primary.port=5432
spring.gorm.postgres.primary.user=postgres
spring.gorm.postgres.primary.password=123456
spring.gorm.postgres.primary.db=test
spring.gorm.postgres.primary.sslmode=disable
spring.gorm.postgres.primary.service-name=postgres-cluster
spring.gorm.postgres.primary.discovery=default

# --- Resilience ------------------------------------------------------------
# Backend-neutral config: every query runs through the builtin "default"
# executor; a burst over rate-limit is rejected with ErrRateLimited.
govern.enabled=true
govern.driver=default
govern.default.enabled=true
govern.default.rate-limit=5

# --- Health / actuator -----------------------------------------------------
# The per-instance gorm health.Indicator is aggregated on :9370.
spring.actuator.addr=:9370

# --- Dynamic configuration (file-watch) ------------------------------------
spring.config.import=file-watch:./mount/application.properties
