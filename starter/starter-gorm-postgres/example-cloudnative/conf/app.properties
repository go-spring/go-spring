# Disable the built-in HTTP server; probes are served by the actuator.
spring.http.server.enabled=false

# --- Discovery -------------------------------------------------------------
# The "primary" instance's address is resolved through the "default" discovery
# backend (registered in example.go as a static backend pointing at 127.0.0.1:5432)
# rather than hardcoded config — a query succeeds only if resolve -> dial works.
spring.gorm.postgres.instances.primary.host=127.0.0.1
spring.gorm.postgres.instances.primary.port=5432
spring.gorm.postgres.instances.primary.user=postgres
spring.gorm.postgres.instances.primary.password=123456
spring.gorm.postgres.instances.primary.db=test
spring.gorm.postgres.instances.primary.sslmode=disable
spring.gorm.postgres.instances.primary.service-name=postgres-cluster
spring.gorm.postgres.instances.primary.discovery=default

# Governance rules live in their OWN file, watched live by starter-governance's
# file source. Edit conf/govern.properties while the app runs and the policy
# changes without a restart (and without an app-wide property re-bind).
govern.source.file.path=conf/govern.properties

# --- Health / actuator -----------------------------------------------------
# The per-instance gorm health.Indicator is aggregated on :9370.
spring.actuator.addr=:9370

# --- Dynamic configuration (file-watch) ------------------------------------
spring.config.import=file-watch:./mount/application.properties
