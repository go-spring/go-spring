# Observability backend for starter-mail example-otel.
#   app --OTLP/gRPC--> Jaeger (:4317, native OTLP endpoint)
#   app --SMTP--> mailhog (:1025)

services:
  mailhog:
    image: mailhog/mailhog:latest
    container_name: starter-mail
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: mail-otel-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - 127.0.0.1:16686:16686
      - 127.0.0.1:4317:4317