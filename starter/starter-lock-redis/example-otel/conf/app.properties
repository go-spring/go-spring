# A Redis client managed by starter-go-redis. The lock starter reuses this
# client by name, so switching lock backend later is just a blank-import swap.
spring.go-redis.cache.addr=127.0.0.1:6379

# A Locker bound to the redis client above. `client` is required; leaving it
# empty makes the starter fail-fast on boot.
spring.lock.jobs.client=cache
spring.lock.jobs.ttl=10s
spring.lock.jobs.retry-interval=100ms
spring.lock.jobs.key-prefix=starter-lock-redis:example:

# Observability: OTLP gRPC trace exporter → Jaeger on :4317.
spring.observability.enable=true
spring.observability.service-name=lock-redis-otel-example
spring.observability.trace.exporter=otlp-grpc
spring.observability.trace.endpoint=127.0.0.1:4317
spring.observability.trace.insecure=true
spring.observability.trace.sampler-ratio=1.0

spring.observability.metrics.exporter=prometheus
spring.observability.metrics.port=9090
spring.observability.metrics.path=/metrics
