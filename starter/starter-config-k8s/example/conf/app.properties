# Import a ConfigMap through the Kubernetes API with the "k8s" provider.
# "optional:" lets the app start even when no cluster is reachable; in-cluster
# the value is read at startup and refreshed live as an informer watches the
# ConfigMap. Source form: <kind>/<name>[?namespace=..&key=..&format=..].
spring.config.import=optional:k8s:configmap/app-config?namespace=default&key=application.yaml

# This example only exercises the config provider, so the default main HTTP
# server is disabled to keep the smoke test focused.
spring.http.server.enabled=false
