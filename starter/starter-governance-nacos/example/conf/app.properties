# The governance rules live in their OWN dataId, watched by
# starter-governance-nacos — nothing under * rides app.properties. This
# block is the entire wiring: it arms the conditional module, whose Source bean
# is injected onto the governance center.
#
# Optional keys (defaults shown):
#   source.nacos.dial-timeout=5s
#   source.nacos.namespace=
#   source.nacos.username=
#   source.nacos.password=
#   source.nacos.format=        # inferred from the dataId's extension
source.nacos.server=127.0.0.1:8848
source.nacos.dial-timeout=5s
source.nacos.data-id=gs-govern-demo.yaml
source.nacos.group=DEFAULT_GROUP
