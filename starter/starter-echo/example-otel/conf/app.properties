# Disable Go-Spring's built-in HTTP server so the echo.Echo bean
# owns the port through the starter-echo SimpleEchoServer wrapper.
spring.http.server.enabled=false

# starter-echo listens on :8002.
spring.echo.server.addr=:8002

# Expose the liveness endpoint for basic health probe assertion.
spring.echo.server.health.enabled=true
spring.echo.server.health.path=/healthz

# Enable tracing and metrics middleware (off by default).
spring.echo.server.middleware.tracing.enabled=true
spring.echo.server.middleware.metrics.enabled=true

# Observability: stdout trace exporter (self-contained, no collector needed).
spring.observability.enable=true
spring.observability.service-name=echo-otel-example
spring.observability.trace.exporter=stdout
spring.observability.trace.sampler-ratio=1.0
spring.observability.metrics.exporter=prometheus
spring.observability.metrics.port=0
spring.observability.metrics.path=/metrics

# Actuator management server on :9371 (different from gin's :9370).
spring.actuator.enabled=true
spring.actuator.addr=:9371