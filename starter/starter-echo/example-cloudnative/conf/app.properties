# Disable Go-Spring's built-in HTTP server; echo owns the business port (:8082)
# and the actuator owns the management port (:9370).
spring.http.server.enabled=false

# --- Application host (starter-echo) ----------------------------------------
spring.echo.server.addr=:8082
# echo's built-in health endpoint is left off so probes are unambiguous: the
# actuator on :9370 owns /health, /readiness and /startup.
spring.echo.server.health.enabled=false

# --- Health / actuator ------------------------------------------------------
spring.actuator.addr=:9370

# --- Dynamic configuration (file-watch) ------------------------------------
spring.config.import=file-watch:./mount/application.properties
