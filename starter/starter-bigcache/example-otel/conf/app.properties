spring.bigcache.instances.hot.life-window=10m
spring.bigcache.instances.hot.shards=256
spring.bigcache.instances.hot.stats-enabled=true

# A second instance, so the gauges can be shown to be per-instance: filling this
# one past its 1MB cap moves its own entries/misses series while hot's stay put.
spring.bigcache.instances.evict.shards=2
spring.bigcache.instances.evict.life-window=1m
spring.bigcache.instances.evict.hard-max-cache-size=1
spring.bigcache.instances.evict.max-entry-size=1024

# Disable gs's default SimpleHttpServer (it listens on :9090 by default) so the
# Prometheus exporter below owns :9090/metrics exclusively.
spring.http.server.enabled=false

# Observability: surface starter-bigcache's OTel gauges (bigcache.hits,
# bigcache.misses, ...) via the in-process Prometheus pull exporter served by
# starter-otel at :9090/metrics. No external collector is needed.
#
# Traces too: the *Cache wrapper opens a span for every Get/Set/Delete (it is the
# starter's own emitter; there is no executor chain). "stdout" is one of
# starter-otel's built-in exporters and needs no collector - the spans print
# alongside the example's output, so you can read them. Swap in otlp-grpc plus an
# endpoint to ship them somewhere instead.
spring.observability.enable=true
spring.observability.service-name=bigcache-otel-example
spring.observability.metrics.exporter=prometheus
spring.observability.metrics.port=9090
spring.observability.metrics.path=/metrics
spring.observability.trace.exporter=stdout
