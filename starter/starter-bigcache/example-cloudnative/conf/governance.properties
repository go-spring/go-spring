# Governance rules. A standalone document, NOT part of app.properties: the file
# source (spring.governance.source.file.path) watches it and pushes each good re-parse to
# the governance center, so a change refreshes governance only.
#
# Keys use the spring.governance.* namespace (spring.governance.enabled, spring.governance.client.default.*,
# spring.governance.client.rules[n].*, spring.governance.client.fault.*) — the same keys a governance document uses
# whether it arrives from this file, an HTTP console, or a config center.

# --- Governance (centralized resilience) -----------------------------------
# Every bigcache Get/Set/Delete runs through the builtin "default" executor, but
# the policy now flows from the centralized governance center instead
# of a per-starter resilience.* binding. The center fans policy
# changes to every registered resource, so this policy is hot-reloadable. The
# bigcache instance's resource label is "bigcache:cache"; it has no Override
# entry, so it falls back to spring.governance.client.default (rate-limit 5/s → a burst is rejected
# with ErrRateLimited).
spring.governance.enabled=true
spring.governance.driver=default
spring.governance.client.default.rate-limit=5
