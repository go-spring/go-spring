# Disable the built-in HTTP server; probes are served by the actuator.
spring.http.server.enabled=false

# --- BigCache instance -------------------------------------------------------
# bigcache is an in-process heap cache, so there is no address or pool to
# configure — only sizing and eviction knobs. One instance ("cache") is created
# from this map entry; the starter wires it as *Cache (autowire:"cache")
# and auto-exports a health.Indicator under the same name.
spring.bigcache.instances.cache.shards=256
spring.bigcache.instances.cache.life-window=1m
spring.bigcache.instances.cache.stats-enabled=true

# Governance rules live in their OWN file, watched live by starter-governance's
# file source. Edit conf/govern.properties while the app runs and the policy
# changes without a restart (and without an app-wide property re-bind).
govern.source.file.path=conf/govern.properties

# --- Health / actuator -----------------------------------------------------
# The per-instance bigcache health.Indicator is aggregated on :9370.
spring.actuator.addr=:9370

# --- Dynamic configuration (file-watch) ------------------------------------
# demo.label lives in the watched mount; the example rewrites it and observes a
# hot reload with no restart.
spring.config.import=file-watch:./mount/application.properties
