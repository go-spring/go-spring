# Family-wide defaults. Every instance inherits any key it does not set itself
# (flatten.WithFallback over spring.bigcache.instances -> spring.bigcache.default),
# so the shape shared by all instances is written once here.
spring.bigcache.default.shards=1024
spring.bigcache.default.life-window=10m
spring.bigcache.default.stats-enabled=true

# driver.go registers one Driver bean, named "hook": it owns the assembly so it
# can reach bigcache.Config.OnRemove, which the starter does not bind. This key
# selects it by name for the whole family; an instance overrides it with its own
# <name>.driver.
spring.bigcache.default.driver=hook

# The HTTP handlers in main.go are served by gs's built-in server. Its address is
# declared here rather than left to the framework default, so the port the code
# and the README use is the port this file owns.
spring.http.server.addr=127.0.0.1:9090

# An instance exists because at least one key is written under it - a bare
# spring.bigcache.instances.<name> with everything inherited would not create a
# bean at all.

# hot: the workhorse. Overrides only life-window (short retention); shards and
# stats-enabled come from the default bucket.
spring.bigcache.instances.hot.life-window=1m

# cold: long-lived. A different life-window is the whole reason for a second
# instance - BigCache has no per-entry TTL.
spring.bigcache.instances.cold.life-window=30m

# cleaned / uncleaned: the same 1s life-window, differing only in clean-window.
# They exist to pin down what life-window does and does not do: it marks an entry
# stale, but a Get never checks age - the cleaner is what removes the entry. So
# `cleaned` (cleaner on) stops serving it, and `uncleaned` (cleaner off) keeps
# serving it. Both are asserted in main.go.
#
# Note life-window is truncated to whole seconds internally (lifeWindow =
# uint64(LifeWindow.Seconds())) and the staleness test is a strict >, so a 1s
# window means "stale after more than one whole second".
spring.bigcache.instances.cleaned.life-window=1s
spring.bigcache.instances.cleaned.clean-window=100ms

spring.bigcache.instances.uncleaned.life-window=1s
spring.bigcache.instances.uncleaned.clean-window=0

# evict: tiny and hard-capped. Filling it past 1MB forces evictions, which is when
# the OnRemove hook the Driver installed fires.
#
# clean-window and max-entries-in-window appear here for completeness. Neither is
# observable from a Get: clean-window=0 only skips the background cleaner
# goroutine, and max-entries-in-window only sizes the startup pre-allocation.
# Eviction under hard-max-cache-size happens on Set regardless of the cleaner,
# which is what the example asserts.
spring.bigcache.instances.evict.driver=hook
spring.bigcache.instances.evict.shards=2
spring.bigcache.instances.evict.life-window=1m
spring.bigcache.instances.evict.clean-window=0
spring.bigcache.instances.evict.max-entries-in-window=4096
spring.bigcache.instances.evict.max-entry-size=1024
spring.bigcache.instances.evict.hard-max-cache-size=1
