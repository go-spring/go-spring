# BigCache is an embedded in-process cache — only sizing knobs, no address.
spring.bigcache.instances.load.shards=1024
spring.bigcache.instances.load.life-window=10m
spring.bigcache.instances.load.clean-window=1m
spring.bigcache.instances.load.max-entries-in-window=600000
spring.bigcache.instances.load.max-entry-size=500

# Governance rules live in their OWN file, watched live by starter-governance's
# file source. Edit conf/govern.properties while the app runs and the policy
# changes without a restart (and without an app-wide property re-bind).
govern.source.file.path=conf/govern.properties
