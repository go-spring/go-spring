# Import configuration from the Consul KV store. "optional:" lets the app
# start even when the key does not exist yet; the value is filled in once
# published and refreshed live via the provider's blocking-query watcher.
spring.config.import=optional:consul:127.0.0.1:8500/gs-config-demo?format=properties

# This example only exercises the config provider, so the default main HTTP
# server is disabled to keep the smoke test focused.
spring.http.server.enabled=false
