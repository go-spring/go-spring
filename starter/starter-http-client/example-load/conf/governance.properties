# Governance rules. A standalone document, NOT part of app.properties: the file
# source (spring.governance.source.file.path) watches it and pushes each good re-parse to
# the governance center, so a change refreshes governance only.
#
# Keys use the spring.governance.* namespace (spring.governance.driver, spring.governance.client.default.*,
# spring.governance.client.rules[n].*, spring.governance.client.fault.*) — the same keys a governance document uses
# whether it arrives from this file, an HTTP console, or a config center.

# Fault injection is now centralized under spring.governance.* in the governance rules file,
# so there is no per-client fault key. This example demonstrates
# fault in fault-only mode (resilience off): fault wraps a zero-policy executor
# and injects into the RoundTripper directly. Flip spring.governance.client.fault.* to "set fire".
#
# Fault injection (spring.governance.client.fault.*). Inert until a rate/latency is set; to fire:
#   spring.governance.client.fault.rate=0.5
#   spring.governance.client.fault.error=generic      # or: timeout / reset

# A document must carry at least one spring.governance.* key (see Parse); with no
# enabled switch left, this inert one is what keeps the document valid.
spring.governance.driver=default
