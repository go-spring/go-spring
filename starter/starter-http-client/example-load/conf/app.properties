spring.http-client.load.addr=127.0.0.1:18080

# Fault injection is now centralized under ${govern} (it rides the same Dync as
# resilience), so there is no per-client fault key. This example demonstrates
# fault in fault-only mode (resilience off): fault wraps a zero-policy executor
# and injects into the RoundTripper directly. Flip govern.fault.* to "set fire".
#
# Fault injection (govern.fault.*). OFF by default; flip to fire:
#   govern.fault.enabled=true
#   govern.fault.rate=0.5
#   govern.fault.error=generic      # or: timeout / reset
govern.fault.enabled=false
