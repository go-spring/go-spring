# Declarative HTTP client instances. Each entry under spring.http-client.instances.<name>
# contributes a route to the process-wide transport installed over
# httpclt.DoRequest; the generated proto.Client only holds a Target, so
# switching addressing is config-only.

# (1) Direct address: pinned to one backend instance, no discovery.
spring.http-client.instances.direct.addr=127.0.0.1:9471

# (2) Service discovery + load balancing: routes by logical name through the
# "static" discovery backend registered in code. The LB strategy and endpoint
# suspension are governance rules, not keys here (see conf/govern.properties).
spring.http-client.instances.discovered.service-name=greet-svc
spring.http-client.instances.discovered.discovery=static

# (3) Resilience: a direct client to a backend that always fails. Policy lives
# process-wide under govern.* (see conf/govern.properties); the bundled zero-dependency "default"
# driver trips the breaker after two consecutive failures. Switching to sentinel
# is govern.driver=sentinel plus a blank import of starter-resilience, no code
# change.
spring.http-client.instances.guarded.addr=127.0.0.1:9473

# Governance rules live in their OWN file, watched live by starter-governance's
# file source. Edit conf/govern.properties while the app runs and the policy
# changes without a restart (and without an app-wide property re-bind).
govern.source.file.path=conf/govern.properties

# This example drives everything from runTest; no inbound HTTP server needed.
spring.http.server.enabled=false

# Observability: OTLP gRPC trace exporter -> Jaeger on :4317.
spring.observability.enable=true
spring.observability.service-name=http-client-otel-example
spring.observability.trace.exporter=otlp-grpc
spring.observability.trace.endpoint=127.0.0.1:4317
spring.observability.trace.insecure=true
spring.observability.trace.sampler-ratio=1.0

spring.observability.metrics.exporter=prometheus
spring.observability.metrics.port=9090
spring.observability.metrics.path=/metrics