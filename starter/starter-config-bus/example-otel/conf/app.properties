# The bus reuses a NATS connection as the refresh transport. The instance name
# must match spring.config.bus.nats-instance (default "config-bus").
spring.nats.instances.config-bus.url=nats://127.0.0.1:4222

# Bus settings. The subject is where refresh signals are published and
# subscribed; every instance sharing it forms one bus. Setting any
# spring.config.bus.* key is what activates the starter. origin labels this
# instance as the publisher in traces and logs.
spring.config.bus.subject=spring.config.refresh
spring.config.bus.origin=config-bus-otel-example

# The value the demo binds to. It starts as "v0"; the demo overrides it via an
# environment source (GS_DEMO_MESSAGE) and then broadcasts a bus refresh so the
# bound field picks up the new value without a restart.
demo.message=v0

# Observability: OTLP gRPC trace exporter -> Jaeger on :4317, and a Prometheus
# endpoint on :9090 the demo scrapes to prove the bus metrics are exported.
spring.observability.enable=true
spring.observability.service-name=config-bus-otel-example
spring.observability.trace.exporter=otlp-grpc
spring.observability.trace.endpoint=127.0.0.1:4317
spring.observability.trace.insecure=true
spring.observability.trace.sampler-ratio=1.0

spring.observability.metrics.exporter=prometheus
spring.observability.metrics.port=9090
spring.observability.metrics.path=/metrics

# The framework's SimpleHttpServer defaults to :9090 (spring.http.server.addr),
# which would collide with the prometheus scrape server above. This example
# serves no HTTP routes, so turn it off.
spring.http.server.enabled=false
