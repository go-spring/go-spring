# Governance rules. A standalone document, NOT part of app.properties: the file
# source (govern.source.file.path) watches it and pushes each good re-parse to
# the governance center, so a change refreshes governance only.
#
# Keys use the govern.* namespace (govern.enabled, govern.default.*,
# govern.rules[n].*, govern.fault.*) — the same keys a governance document uses
# whether it arrives from this file, an HTTP console, or a config center.

# --- Resilience ------------------------------------------------------------
# Backend-neutral config: every query runs through the builtin "default"
# executor; a burst over rate-limit is rejected with ErrRateLimited.
govern.enabled=true
govern.driver=default
govern.default.enabled=true
govern.default.rate-limit=5
