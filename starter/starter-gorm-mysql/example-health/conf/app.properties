# Disable the built-in HTTP server; probes are served by the actuator.
spring.http.server.enabled=false

# A single gorm-mysql instance named "primary". Its pool health is exported as a
# health.Indicator and aggregated by the actuator on :9370.
spring.gorm.mysql.primary.user=root
spring.gorm.mysql.primary.password=123456
spring.gorm.mysql.primary.addr=127.0.0.1:3306
spring.gorm.mysql.primary.db=test
spring.gorm.mysql.primary.ping-timeout=5s

# starter-actuator aggregates every health.Indicator bean on its management port.
spring.actuator.addr=:9370
