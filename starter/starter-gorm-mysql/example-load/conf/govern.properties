# Governance rules. A standalone document, NOT part of app.properties: the file
# source (govern.source.file.path) watches it and pushes each good re-parse to
# the governance center, so a change refreshes governance only.
#
# Keys use the govern.* namespace (govern.enabled, govern.client.default.*,
# govern.client.rules[n].*, govern.client.fault.*) — the same keys a governance document uses
# whether it arrives from this file, an HTTP console, or a config center.

# Governance (the govern.* namespace — shared across all client starters). A small breaker + 1 retry makes "放火" visible in the breakdown.
govern.enabled=true
govern.driver=default
govern.client.default.error-threshold=20
govern.client.default.open-duration=5s
govern.client.default.max-retries=1
govern.client.default.timeout=500ms

# Fault injection (govern.client.fault.*). OFF by default; flip to fire:
#   govern.client.fault.enabled=true
#   govern.client.fault.rate=0.5
#   govern.client.fault.error=generic      # or: timeout / reset
govern.client.fault.enabled=false
