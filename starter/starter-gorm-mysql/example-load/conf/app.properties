spring.gorm.mysql.instances.load.user=root
spring.gorm.mysql.instances.load.password=root
spring.gorm.mysql.instances.load.addr=127.0.0.1:3306
spring.gorm.mysql.instances.load.db=load
spring.gorm.mysql.instances.load.parseTime=true
spring.gorm.mysql.instances.load.charset=utf8mb4

# Governance rules live in their OWN file, watched live by starter-governance's
# file source. Edit conf/govern.properties while the app runs and the policy
# changes without a restart (and without an app-wide property re-bind).
govern.source.file.path=conf/govern.properties
