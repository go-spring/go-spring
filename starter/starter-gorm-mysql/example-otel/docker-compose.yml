services:
  mysql:
    image: mysql:8
    container_name: gorm-mysql-otel-mysql
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: "test"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p123456"]
      interval: 3s
      timeout: 3s
      retries: 30

  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: gorm-mysql-otel-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - 127.0.0.1:16686:16686
      - 127.0.0.1:4317:4317