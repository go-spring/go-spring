# Gateway listens on :9440, proxies to upstream on :19000.
spring.gateway.server.addr=:9440

spring.gateway.routes.api.predicates.path=/api/**
spring.gateway.routes.api.filters=stripPrefix(1)
spring.gateway.routes.api.upstream.target=http://127.0.0.1:19000

spring.gateway.server.filter.tracing.enabled=true

spring.observability.enable=true
spring.observability.service-name=gateway-otel-example
spring.observability.trace.exporter=otlp-grpc
spring.observability.trace.endpoint=127.0.0.1:4317
spring.observability.trace.insecure=true
spring.observability.trace.sampler-ratio=1.0

spring.observability.metrics.exporter=prometheus
spring.observability.metrics.port=9090
spring.observability.metrics.path=/metrics