# Import a single mounted configuration file using the "file-watch" provider.
# The path points at one ConfigMap/Secret key file (here application.properties,
# a symlink resolved through ..data); the provider watches the parent directory
# so changes — including the atomic ..data symlink swap Kubernetes performs on a
# ConfigMap / Secret update — trigger a live property refresh.
#
# In a real deployment point at a specific mounted key file, e.g.
#   spring.app.imports=file-watch:/etc/config/application.yaml
# The file is parsed by extension (.properties/.yaml/.toml/.json).
spring.app.imports=file-watch:./mount/application.properties

# This example only exercises the config provider, so the default main HTTP
# server is disabled to keep the smoke test focused.
spring.http.server.enabled=false
