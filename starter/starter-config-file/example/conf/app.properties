# Import a single mounted configuration file with the "file-watch" provider.
# The file must exist at startup; its value is refreshed live as the provider
# watches the parent directory, picking up Kubernetes' atomic ..data symlink
# swap on a ConfigMap/Secret update. The extension selects the parser
# (.properties/.yaml/.toml/.json).
spring.config.import=file-watch:./mount/application.properties

# This example only exercises the config provider, so the default main HTTP
# server is disabled to keep the smoke test focused.
spring.http.server.enabled=false
