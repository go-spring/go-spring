# Import a directory tree of scalar key files with the "configtree" provider.
# Each file's name is the property key (K8s allows '.' in key names) and its
# content is the raw value. The directory must exist at startup; its values are
# refreshed live as the provider watches the parent directory, picking up
# Kubernetes' atomic ..data symlink swap on a Secret/ConfigMap update.
spring.config.import=configtree:./mount

# This example only exercises the config provider, so the default main HTTP
# server is disabled to keep the smoke test focused.
spring.http.server.enabled=false
