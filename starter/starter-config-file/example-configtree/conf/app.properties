# Import a directory tree of scalar key files using the "configtree" provider.
# This reproduces a Kubernetes Secret / env-style ConfigMap mount: each key is a
# flat file whose name is the property key (K8s allows '.' in key names, so the
# files here are db.user, db.password, server.port) and whose content is the
# raw value. The provider watches the parent directory, so the atomic ..data
# symlink swap Kubernetes performs on an update triggers a live refresh.
#
# In a real deployment this would be the Secret mount path, e.g.
#   spring.app.imports=configtree:/etc/secret
spring.app.imports=configtree:./mount

# This example only exercises the config provider, so the default main HTTP
# server is disabled to keep the smoke test focused.
spring.http.server.enabled=false
