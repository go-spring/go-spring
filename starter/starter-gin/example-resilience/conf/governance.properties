# Governance rules. A standalone document, NOT part of app.properties: the file
# source (spring.governance.source.file.path) watches it and pushes each good re-parse to
# the governance center, so a change refreshes governance only.
#
# Keys use the spring.governance.* namespace (spring.governance.driver, spring.governance.server.default.*,
# spring.governance.server.rules[n].*, spring.governance.server.fault.*) — the same keys a governance document uses
# whether it arrives from this file, an HTTP console, or a config center.

# Inbound admission via the centralized governance center. Enabled here with the
# builtin "default" driver at 5 QPS: a burst is shed with 429. The inbound policy
# has no retry and no circuit breaker; its knobs under
# spring.governance.server.default are rate-limit, burst, max-concurrent,
# bulkhead-queue-duration and timeout.
spring.governance.driver=default
spring.governance.server.default.rate-limit=5
