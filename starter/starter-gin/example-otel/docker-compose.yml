# Observability backend for starter-gin example-otel.
#   app --OTLP/gRPC--> Jaeger (:4317, native OTLP endpoint)

services:
  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: gin-otel-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - 127.0.0.1:16686:16686
      - 127.0.0.1:4317:4317