# Disable Go-Spring's built-in HTTP server so the gin.Engine bean
# owns the port through the starter-gin SimpleGinServer wrapper.
spring.http.server.enabled=false

# starter-gin listens on :8001 so it can run alongside starter-echo
# (:8002) and starter-hertz (:8003) without a port clash.
spring.gin.server.addr=:8001

# Expose the liveness endpoint for basic health probe assertion.
spring.gin.server.health.enabled=true
spring.gin.server.health.path=/healthz

# Enable tracing and metrics middleware (off by default).
# The middleware uses OTel globals installed by starter-otel below.
spring.gin.server.middleware.tracing.enabled=true
spring.gin.server.middleware.metrics.enabled=true

# ------------------------------------------------------------------
# Observability: starter-otel provides the TracerProvider and
# MeterProvider globals. stdout trace exporter keeps the example
# self-contained (no collector needed), and Prometheus /metrics is
# served through the actuator management port (:9370).
# ------------------------------------------------------------------
spring.observability.enable=true
spring.observability.service-name=gin-otel-example
spring.observability.trace.exporter=stdout
spring.observability.trace.sampler-ratio=1.0
spring.observability.metrics.exporter=prometheus
spring.observability.metrics.port=0
spring.observability.metrics.path=/metrics

# Actuator management server: /health, /readiness, /startup, /info,
# and the mounted /metrics all live here on :9370.
spring.actuator.enabled=true
spring.actuator.addr=:9370
