# Governance rules. A standalone document, NOT part of app.properties: the file
# source (govern.source.file.path) watches it and pushes each good re-parse to
# the governance center, so a change refreshes governance only.
#
# Keys use the govern.* namespace (govern.enabled, govern.default.*,
# govern.rules[n].*, govern.fault.*) — the same keys a governance document uses
# whether it arrives from this file, an HTTP console, or a config center.

# Governance (the govern.* namespace — shared across all client starters). A small breaker + 1 retry makes the
# effect of "放火" visible: injected failures trip the breaker, which surfaces as
# ErrCircuitOpen in the load report.
govern.enabled=true
govern.driver=default
govern.default.enabled=true
govern.default.error-threshold=20
govern.default.open-duration=5s
govern.default.max-retries=1
govern.default.timeout=500ms

# Fault injection (centralized govern.fault.*, rides the same governance source as resilience).
# OFF by default. To "set fire", flip enabled to true and pick a rate/kind —
# with the breaker above on, expect the load report's injected/circuit counts to
# climb and p99 to rise as retries stack up:
#
#   govern.fault.enabled=true
#   govern.fault.rate=0.5
#   govern.fault.error=generic      # or: timeout / reset
#
# Latency-only fault (slow downstream, no errors):
#   govern.fault.enabled=true
#   govern.fault.latency=50ms
govern.fault.enabled=false
