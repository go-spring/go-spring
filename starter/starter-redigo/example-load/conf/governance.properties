# Governance rules. A standalone document, NOT part of app.properties: the file
# source (spring.governance.source.file.path) watches it and pushes each good re-parse to
# the governance center, so a change refreshes governance only.
#
# Keys use the spring.governance.* namespace (spring.governance.enabled, spring.governance.client.default.*,
# spring.governance.client.rules[n].*, spring.governance.client.fault.*) — the same keys a governance document uses
# whether it arrives from this file, an HTTP console, or a config center.

# Governance (the spring.governance.* namespace — shared across all client starters). A small breaker + 1 retry makes the
# effect of "放火" visible: injected failures trip the breaker, which surfaces as
# ErrCircuitOpen in the load report.
spring.governance.enabled=true
spring.governance.driver=default
spring.governance.client.default.error-threshold=20
spring.governance.client.default.open-duration=5s
spring.governance.client.default.max-retries=1
spring.governance.client.default.timeout=500ms

# Fault injection (centralized spring.governance.client.fault.*, rides the same governance source as resilience).
# OFF by default. To "set fire", flip enabled to true and pick a rate/kind —
# with the breaker above on, expect the load report's injected/circuit counts to
# climb and p99 to rise as retries stack up:
#
#   spring.governance.client.fault.enabled=true
#   spring.governance.client.fault.rate=0.5
#   spring.governance.client.fault.error=generic      # or: timeout / reset
#
# Latency-only fault (slow downstream, no errors):
#   spring.governance.client.fault.enabled=true
#   spring.governance.client.fault.latency=50ms
spring.governance.client.fault.enabled=false
