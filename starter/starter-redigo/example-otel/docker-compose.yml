services:
  redis:
    image: redis:7
    container_name: redigo-otel-redis
    ports:
      - "127.0.0.1:6379:6379"

  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: redigo-otel-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - 127.0.0.1:16686:16686
      - 127.0.0.1:4317:4317
