# The example's own external input, injected into the overriding Driver bean
# from the config file (proves config-file data reaches a custom driver).
spring.example.redis-extra=from-config-file

spring.redigo.instances.cache.addr=127.0.0.1:6379

spring.redigo.instances.session.addr=127.0.0.1:6379

# This instance resolves its address via service discovery. `addr` is a dummy
# on purpose — it is ignored because `service-name` is set, proving the address
# comes from the registered discovery backend (see discovery.go), not config.
# Service discovery is consumed by the one-shot assembly (NewPool) that the
# process-wide driver delegates to.
spring.redigo.instances.discovery.addr=0.0.0.0:0
spring.redigo.instances.discovery.service-name=redis-cluster

# TLS is off by default. To dial Redis over TLS, enable it and point at the
# CA/cert files (client cert/key only needed for mutual TLS). Field names match
# starter-go-redis:
#   spring.redigo.instances.cache.tls.enabled=true
#   spring.redigo.instances.cache.tls.ca-file=/path/to/ca.pem
#   spring.redigo.instances.cache.tls.cert-file=/path/to/client.pem
#   spring.redigo.instances.cache.tls.key-file=/path/to/client.key
#   spring.redigo.instances.cache.tls.server-name=redis.example.com
# The discovery backend bean name (a named discovery.Discovery bean
# registered in init) that resolves this instance's service-name.
spring.redigo.instances.discovery.discovery=default
