# Import configuration from a mock Apollo config service started by this
# example. "optional:" lets the app start even when the namespace does not
# exist yet; the value is filled in once published and refreshed live via the
# provider's long-poll watcher.
spring.config.import=optional:apollo:127.0.0.1:18080/application?appId=demo&format=properties

# This example only exercises the config provider, so the default main HTTP
# server is disabled to keep the smoke test focused.
spring.http.server.enabled=false
