# Observability backend for starter-elasticsearch example-otel.
#   app --OTLP/gRPC--> Jaeger (:4317, native OTLP endpoint)
#   app --elasticsearch--> elasticsearch (single-node)

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: elasticsearch-otel-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9200:9200"

  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: elasticsearch-otel-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - 127.0.0.1:16686:16686
      - 127.0.0.1:4317:4317