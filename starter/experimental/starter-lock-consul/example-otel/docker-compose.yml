# Observability backend for starter-lock-consul example-otel.
#   app --OTLP/gRPC--> Jaeger (:4317, native OTLP endpoint)
#   app --lock--> consul (single-node)

services:
  consul:
    image: hashicorp/consul:1.18
    container_name: lock-consul-otel-consul
    command: ["agent", "-dev", "-client=0.0.0.0"]
    ports:
      - "127.0.0.1:8500:8500"

  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: lock-consul-otel-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - 127.0.0.1:16686:16686
      - 127.0.0.1:4317:4317