spring.lock.instances.jobs.address=127.0.0.1:8500
spring.lock.instances.jobs.ttl=15s
spring.lock.instances.jobs.key-prefix=demo/jobs/

spring.lock.instances.singleton.address=127.0.0.1:8500
spring.lock.instances.singleton.ttl=15s
spring.lock.instances.singleton.key-prefix=demo/singleton/

# TLS to the Consul agent (optional). The local smoke agent runs on plain HTTP,
# so these stay disabled here; a hardened deployment would set them, e.g.:
#   spring.lock.instances.jobs.tls.enabled=true
#   spring.lock.instances.jobs.tls.ca-file=/etc/consul/ca.pem
#   spring.lock.instances.jobs.tls.cert-file=/etc/consul/client-cert.pem
#   spring.lock.instances.jobs.tls.key-file=/etc/consul/client-key.pem

spring.observability.enable=true
spring.observability.service-name=lock-consul-otel-example
spring.observability.trace.exporter=otlp-grpc
spring.observability.trace.endpoint=127.0.0.1:4317
spring.observability.trace.insecure=true
spring.observability.trace.sampler-ratio=1.0
spring.observability.metrics.exporter=prometheus
spring.observability.metrics.port=9090
spring.observability.metrics.path=/metrics