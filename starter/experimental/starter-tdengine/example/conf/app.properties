# The official docker image ships root/taosdata and runs taosAdapter (the
# websocket endpoint) on 6041.
spring.tdengine.instances.a.dsn=root:taosdata@ws(127.0.0.1:6041)/
spring.tdengine.instances.a.max-open-conns=4
spring.tdengine.instances.a.max-idle-conns=2

# A second client against the same instance shows the multi-instance wiring.
spring.tdengine.instances.b.dsn=root:taosdata@ws(127.0.0.1:6041)/power

# TLS example (disabled: the local container runs plaintext).
# spring.tdengine.instances.a.dsn=root:taosdata@wss(127.0.0.1:6041)/power
