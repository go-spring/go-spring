# Observability backend for starter-gorm-clickhouse example-otel.
#   app --OTLP/gRPC--> Jaeger (:4317, native OTLP endpoint)
#   app --clickhouse--> clickhouse (single-node)

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24
    container_name: gorm-clickhouse-otel-clickhouse
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:8123:8123"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q localhost:8123/ping || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 60

  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: gorm-clickhouse-otel-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - 127.0.0.1:16686:16686
      - 127.0.0.1:4317:4317