# starter-transaction-at-gorm keeps the in-process coordinator on with its
# defaults. Both toggles below are the built-in defaults, shown here for
# discoverability.
spring.transaction.at.enabled=true

# Tracing wires the otel observer so each branch's second-phase (commit /
# rollback) emits a child span on the globals starter-otel installs. It costs
# almost nothing without starter-otel, since the global tracer is then a no-op.
spring.transaction.at.tracing=true

# Observability: OTLP gRPC trace exporter → Jaeger on :4317.
spring.observability.enable=true
spring.observability.service-name=transaction-at-gorm-otel-example
spring.observability.trace.exporter=otlp-grpc
spring.observability.trace.endpoint=127.0.0.1:4317
spring.observability.trace.insecure=true
spring.observability.trace.sampler-ratio=1.0

spring.observability.metrics.exporter=prometheus
spring.observability.metrics.port=9090
spring.observability.metrics.path=/metrics