spring.lock.instances.main.endpoints=127.0.0.1:2379
spring.lock.instances.main.ttl=10s
spring.lock.instances.main.key-prefix=/starter-lock-etcd/

# TLS is off for the local smoke broker. In production wire it via:
#   spring.lock.instances.main.tls.enabled=true
#   spring.lock.instances.main.tls.ca-file=/etc/etcd/ca.pem
#   spring.lock.instances.main.tls.cert-file=/etc/etcd/client-cert.pem
#   spring.lock.instances.main.tls.key-file=/etc/etcd/client-key.pem

spring.observability.enable=true
spring.observability.service-name=lock-etcd-otel-example
spring.observability.trace.exporter=otlp-grpc
spring.observability.trace.endpoint=127.0.0.1:4317
spring.observability.trace.insecure=true
spring.observability.trace.sampler-ratio=1.0
spring.observability.metrics.exporter=prometheus
spring.observability.metrics.port=9090
spring.observability.metrics.path=/metrics
