# Disable the built-in HTTP server; probes are served by the actuator.
spring.http.server.enabled=false

# --- Discovery -------------------------------------------------------------
# The "docs" instance's node addresses are resolved through the "default"
# discovery backend (registered in example.go as a static backend pointing at
# 127.0.0.1:9200) rather than hardcoded config. The dummy `addresses` below is
# overridden because `service-name` is set — index/get succeed only if
# resolve -> dial -> serve works.
spring.elasticsearch.instances.docs.addresses=http://127.0.0.1:9200
spring.elasticsearch.instances.docs.service-name=es-cluster
spring.elasticsearch.instances.docs.discovery-scheme=http

# Governance rules live in their OWN file, watched live by starter-governance's
# file source. Edit conf/govern.properties while the app runs and the policy
# changes without a restart (and without an app-wide property re-bind).
govern.source.file.path=conf/govern.properties

# --- Health / actuator -----------------------------------------------------
# The per-instance elasticsearch health.Indicator is aggregated on :9370.
spring.actuator.addr=:9370

# --- Dynamic configuration (file-watch) ------------------------------------
spring.config.import=file-watch:./mount/application.properties
