# A Redis client managed by starter-go-redis. The counter store counts through
# this client, so topology changes (shared cluster vs dedicated) stay
# config-only on the redis side.
spring.go-redis.instances.cache.addr=127.0.0.1:6379

# The starter's one key: which *goredis.Client bean backs the shared rate-limit
# counters. Contributing the store is the whole switch — every executor in this
# process then spends one Redis budget per scope instead of per-replica counters.
spring.ratelimit.redis.client=cache

# Governance rules live in their own file (their own refresh channel); this key
# arms its file source. The rate-limit knobs themselves (rate-limit/burst/...)
# are resilience.Policy fields there, not starter configuration.
govern.source.file.path=conf/govern.yaml
