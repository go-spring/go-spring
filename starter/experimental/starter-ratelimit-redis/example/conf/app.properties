# A Redis client managed by starter-go-redis. The limiter driver reuses this
# client by name, so topology changes (shared cluster vs dedicated) stay
# config-only on the redis side.
spring.go-redis.instances.cache.addr=127.0.0.1:6379

# A Redis-backed limiter driver bound to the client above. `client` is required
# (fail-fast when empty); `driver` is the name consumers select it by — here
# "redis", registered with resilience.GetLimiter("redis"). The example's two
# handlers model two replicas sharing this one global budget.
spring.ratelimit.redis.instances.gateway.client=cache
spring.ratelimit.redis.instances.gateway.driver=redis
