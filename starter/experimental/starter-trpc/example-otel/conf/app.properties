# tRPC server bind address.
spring.trpc.server.addr=127.0.0.1:8000

# Observability filters: tracing/metrics ride the OTel globals installed by
# starter-otel (no-op without it). Both default to true; shown explicitly.
spring.trpc.server.observer.tracing.enabled=true
spring.trpc.server.observer.metrics.enabled=true

# Observability: OTLP gRPC trace exporter → Jaeger on :4317.
spring.observability.enable=true
spring.observability.service-name=trpc-otel-example
spring.observability.trace.exporter=otlp-grpc
spring.observability.trace.endpoint=127.0.0.1:4317
spring.observability.trace.insecure=true
spring.observability.trace.sampler-ratio=1.0

# Observability: Prometheus metrics on dedicated port :9090.
spring.observability.metrics.exporter=prometheus
spring.observability.metrics.port=9090
spring.observability.metrics.path=/metrics