spring.pulsar.a.url=pulsar://127.0.0.1:6650
spring.pulsar.a.fail-fast=true
spring.pulsar.a.health-check-topic=persistent://public/default/hello
spring.pulsar.a.metrics.enabled=true
spring.pulsar.a.metrics.port=9091

spring.pulsar.b.url=pulsar://127.0.0.1:6650
spring.pulsar.b.fail-fast=true
spring.pulsar.b.health-check-topic=persistent://public/default/hello

# Observability: OTLP gRPC trace exporter -> Jaeger on :4317.
spring.observability.enable=true
spring.observability.service-name=pulsar-otel-example
spring.observability.trace.exporter=otlp-grpc
spring.observability.trace.endpoint=127.0.0.1:4317
spring.observability.trace.insecure=true
spring.observability.trace.sampler-ratio=1.0

spring.observability.metrics.exporter=prometheus
spring.observability.metrics.port=9090
spring.observability.metrics.path=/metrics
