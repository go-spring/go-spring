# Disable the built-in HTTP server; probes are served by the actuator.
spring.http.server.enabled=false

# --- Discovery -------------------------------------------------------------
# The "graph" instance's address is resolved through the "default" discovery
# backend (registered in example.go as a static backend pointing at 127.0.0.1:7687)
# rather than hardcoded config — a Cypher round-trip succeeds only if resolve ->
# dial works. The neo4j driver has no dialer hook, so this resolves once at startup.
spring.neo4j.instances.graph.uri=bolt://0.0.0.0:0
spring.neo4j.instances.graph.username=neo4j
spring.neo4j.instances.graph.password=password
spring.neo4j.instances.graph.service-name=neo4j-cluster
spring.neo4j.instances.graph.discovery=default

# Governance rules live in their OWN file, watched live by starter-governance's
# file source. Edit conf/govern.properties while the app runs and the policy
# changes without a restart (and without an app-wide property re-bind).
govern.source.file.path=conf/govern.properties

# --- Health / actuator -----------------------------------------------------
# The per-instance neo4j health.Indicator is aggregated on :9370.
spring.actuator.addr=:9370

# --- Dynamic configuration (file-watch) ------------------------------------
spring.config.import=file-watch:./mount/application.properties
