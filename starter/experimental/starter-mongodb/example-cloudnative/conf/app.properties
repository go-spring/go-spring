# Disable the built-in HTTP server; probes are served by the actuator.
spring.http.server.enabled=false

# --- Direct instance -------------------------------------------------------
# "a" is dialed directly from its URI; used for the plain CRUD round-trip.
spring.mongodb.instances.a.uri=mongodb://127.0.0.1:27017
spring.mongodb.instances.a.max-pool-size=100
spring.mongodb.instances.a.min-pool-size=1
spring.mongodb.instances.a.server-selection-timeout=10s

# --- Discovery -------------------------------------------------------------
# "disc" resolves its address through the "default" discovery backend
# (registered in example.go as a static backend pointing at 127.0.0.1:27017)
# rather than the (dummy) URI — a round-trip proves resolve -> dial -> serve.
spring.mongodb.instances.disc.uri=mongodb://127.0.0.1:27017
spring.mongodb.instances.disc.service-name=mongo-cluster
spring.mongodb.instances.disc.discovery=default
spring.mongodb.instances.disc.server-selection-timeout=10s

# Governance rules live in their OWN file, watched live by starter-governance's
# file source. Edit conf/govern.properties while the app runs and the policy
# changes without a restart (and without an app-wide property re-bind).
govern.source.file.path=conf/govern.properties

# --- Health / actuator -----------------------------------------------------
# The per-instance mongo health.Indicators are aggregated on :9370.
spring.actuator.addr=:9370

# --- Dynamic configuration (file-watch) ------------------------------------
spring.config.import=file-watch:./mount/application.properties
