# Disable the built-in HTTP server; probes are served by the actuator.
spring.http.server.enabled=false

# --- Direct instance -------------------------------------------------------
# "a" is dialed directly from its URI; used for the plain CRUD round-trip.
spring.mongodb.a.uri=mongodb://127.0.0.1:27017
spring.mongodb.a.max-pool-size=100
spring.mongodb.a.min-pool-size=1
spring.mongodb.a.server-selection-timeout=10s

# --- Discovery -------------------------------------------------------------
# "disc" resolves its address through the "default" discovery backend
# (registered in example.go as a static backend pointing at 127.0.0.1:27017)
# rather than the (dummy) URI — a round-trip proves resolve -> dial -> serve.
spring.mongodb.disc.uri=mongodb://127.0.0.1:27017
spring.mongodb.disc.service-name=mongo-cluster
spring.mongodb.disc.discovery=default
spring.mongodb.disc.server-selection-timeout=10s

# --- Resilience ------------------------------------------------------------
# Backend-neutral config: mongo has no per-command hook, so the seam is the dial
# layer — a burst of fresh connections is partly rejected with ErrRateLimited.
govern.enabled=true
govern.driver=default
govern.default.enabled=true
govern.default.rate-limit=5

# --- Health / actuator -----------------------------------------------------
# The per-instance mongo health.Indicators are aggregated on :9370.
spring.actuator.addr=:9370

# --- Dynamic configuration (file-watch) ------------------------------------
spring.config.import=file-watch:./mount/application.properties
