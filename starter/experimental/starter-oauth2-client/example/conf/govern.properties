# Governance rules. A standalone document, NOT part of app.properties: the file
# source (govern.source.file.path) watches it and pushes each good re-parse to
# the governance center, so a change refreshes governance only.
#
# Keys use the govern.* namespace (govern.enabled, govern.client.default.*,
# govern.client.rules[n].*, govern.client.fault.*) — the same keys a governance document uses
# whether it arrives from this file, an HTTP console, or a config center.

# Resilience wraps this client's transport. Using the bundled zero-dependency
# "default" driver here; switching to sentinel is: driver=sentinel plus a blank
# import of starter-governance-sentinel, with no code change. A flaky endpoint that fails
# twice then succeeds is recovered within max-retries; error-threshold is kept
# high so those transient failures never trip the breaker.
govern.enabled=true
govern.driver=default
govern.client.default.max-retries=3
govern.client.default.error-threshold=10
govern.client.default.attempt-timeout=2s
