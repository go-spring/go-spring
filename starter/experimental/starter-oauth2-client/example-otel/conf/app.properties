spring.oauth2.client.instances.downstream.client-id=demo-client
spring.oauth2.client.instances.downstream.client-secret=demo-secret
spring.oauth2.client.instances.downstream.token-url=http://127.0.0.1:9401/oauth/token
spring.oauth2.client.instances.downstream.scopes=read,write
spring.oauth2.client.instances.downstream.auth-style=header
spring.oauth2.client.instances.downstream.timeout=5s
spring.oauth2.client.instances.downstream.endpoint-params.audience=https://api.example.com

# Governance rules live in their OWN file, watched live by starter-governance's
# file source. Edit conf/govern.properties while the app runs and the policy
# changes without a restart (and without an app-wide property re-bind).
govern.source.file.path=conf/govern.properties

spring.oauth2.authcode.instances.login.client-id=web-client
spring.oauth2.authcode.instances.login.client-secret=web-secret
spring.oauth2.authcode.instances.login.auth-url=http://127.0.0.1:9401/oauth/authorize
spring.oauth2.authcode.instances.login.token-url=http://127.0.0.1:9401/oauth/token
spring.oauth2.authcode.instances.login.redirect-url=http://127.0.0.1:9402/callback
spring.oauth2.authcode.instances.login.scopes=openid,profile

# Observability: OTLP gRPC trace exporter -> Jaeger on :4317.
spring.observability.enable=true
spring.observability.service-name=oauth2-client-otel-example
spring.observability.trace.exporter=otlp-grpc
spring.observability.trace.endpoint=127.0.0.1:4317
spring.observability.trace.insecure=true
spring.observability.trace.sampler-ratio=1.0
spring.observability.metrics.exporter=prometheus
spring.observability.metrics.port=9090
spring.observability.metrics.path=/metrics
