# Kitex server bind address.
spring.kitex.server.addr=:8888

# Kitex tracing attaches to the global OTel pipeline installed by starter-otel
# below - no kitex-owned provider or exporter is created, so the
# spring.kitex.server.tracing.endpoint keys do not apply here.
spring.kitex.server.tracing.enable=true

# Kitex RPC metrics (kitex.server.duration) ride the global pipeline too; no
# dedicated kitex prometheus endpoint is started (metrics.port stays unset).
spring.kitex.server.metrics.enable=true

# Unified observability (starter-otel) owns the pipeline:
# OTLP gRPC trace exporter -> Jaeger on :4317.
spring.observability.enable=true
spring.observability.service-name=kitex-otel-example
spring.observability.trace.exporter=otlp-grpc
spring.observability.trace.endpoint=127.0.0.1:4317
spring.observability.trace.insecure=true
spring.observability.trace.sampler-ratio=1.0

# Unified metrics: Prometheus scrape endpoint on dedicated port :9090.
spring.observability.metrics.exporter=prometheus
spring.observability.metrics.port=9090
spring.observability.metrics.path=/metrics
