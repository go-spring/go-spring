spring.rocketmq.instances.a.name-servers=127.0.0.1:9876
spring.rocketmq.instances.a.fail-fast=true
spring.rocketmq.instances.a.send-timeout=5s

# A second client against the same cluster shows the multi-instance wiring.
spring.rocketmq.instances.b.name-servers=127.0.0.1:9876
spring.rocketmq.instances.b.fail-fast=true

# ACL credentials (disabled: the compose cluster runs without ACL).
# spring.rocketmq.instances.a.access-key=rocketmq
# spring.rocketmq.instances.a.secret-key=12345678

# Instance name distinguishes clients sharing one host (unset: the SDK derives
# a unique name per producer/consumer automatically).
# spring.rocketmq.instances.a.instance-name=app-a
