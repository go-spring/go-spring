# Disable the built-in HTTP server; probes are served by the actuator.
spring.http.server.enabled=false

# --- Kafka instance "a" -----------------------------------------------------
# Bootstrap brokers seed the franz-go client directly (Kafka has no service-name
# to resolve, so discovery is N/A and omitted).
spring.kafka.instances.a.brokers=127.0.0.1:9092
spring.kafka.instances.a.topic=hello
spring.kafka.instances.a.group=hello-group

# Producer tuning (works against the plaintext dev broker).
spring.kafka.instances.a.producer.required-acks=all

# Governance rules live in their OWN file, watched live by starter-governance's
# file source. Edit conf/govern.properties while the app runs and the policy
# changes without a restart (and without an app-wide property re-bind).
govern.source.file.path=conf/govern.properties

# SASL / TLS are disabled here because the dev broker is plaintext. Enable them
# against a secured cluster, e.g.:
# spring.kafka.instances.a.sasl.enabled=true
# spring.kafka.instances.a.sasl.mechanism=scram-sha-512
# spring.kafka.instances.a.sasl.username=app
# spring.kafka.instances.a.sasl.password=secret
# spring.kafka.instances.a.tls.enabled=true
# spring.kafka.instances.a.tls.ca-file=/etc/kafka/ca.pem

# --- Health / actuator -----------------------------------------------------
# The kafka health.Indicator (Ping probe) is aggregated on :9370.
spring.actuator.addr=:9370

# --- Dynamic configuration (file-watch) ------------------------------------
spring.config.import=file-watch:./mount/application.properties
