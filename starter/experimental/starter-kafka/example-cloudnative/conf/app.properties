# Disable the built-in HTTP server; probes are served by the actuator.
spring.http.server.enabled=false

# --- Kafka instance "a" -----------------------------------------------------
# Bootstrap brokers seed the franz-go client directly (Kafka has no service-name
# to resolve, so discovery is N/A and omitted).
spring.kafka.a.brokers=127.0.0.1:9092
spring.kafka.a.topic=hello
spring.kafka.a.group=hello-group

# Producer tuning (works against the plaintext dev broker).
spring.kafka.a.producer.required-acks=all

# --- Resilience via ${govern} ----------------------------------------------
# Backend-neutral config: every synchronous produce runs through the builtin
# "default" executor; a burst over rate-limit is rejected with ErrRateLimited.
# Consume is not guarded (franz-go's poll path is passive).
govern.enabled=true
govern.driver=default
govern.default.enabled=true
govern.default.rate-limit=8

# SASL / TLS are disabled here because the dev broker is plaintext. Enable them
# against a secured cluster, e.g.:
# spring.kafka.a.sasl.enabled=true
# spring.kafka.a.sasl.mechanism=scram-sha-512
# spring.kafka.a.sasl.username=app
# spring.kafka.a.sasl.password=secret
# spring.kafka.a.tls.enabled=true
# spring.kafka.a.tls.ca-file=/etc/kafka/ca.pem

# --- Health / actuator -----------------------------------------------------
# The kafka health.Indicator (Ping probe) is aggregated on :9370.
spring.actuator.enabled=true
spring.actuator.addr=:9370

# --- Dynamic configuration (file-watch) ------------------------------------
spring.config.import=file-watch:./mount/application.properties
