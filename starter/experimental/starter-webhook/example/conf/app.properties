# The example's own local receiver stands in for a chat-platform webhook.
spring.webhook.instances.local.url=http://127.0.0.1:18080/hook
spring.webhook.instances.local.channel=generic
spring.webhook.instances.local.timeout=5s

# A DingTalk robot would look like (secret = 加签密钥):
# spring.webhook.instances.alert.url=https://oapi.dingtalk.com/robot/send?access_token=xxx
# spring.webhook.instances.alert.channel=dingtalk
# spring.webhook.instances.alert.secret=SEC...

# Feishu / WeCom / Slack bots:
# spring.webhook.instances.alert.url=https://open.feishu.cn/open-apis/bot/v2/hook/xxx
# spring.webhook.instances.alert.channel=feishu
# spring.webhook.instances.alert.secret=...
# spring.webhook.instances.ops.url=https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=xxx
# spring.webhook.instances.ops.channel=wecom
# spring.webhook.instances.ops.url=https://hooks.slack.com/services/XXX/YYY/ZZZ
# spring.webhook.instances.ops.channel=slack
