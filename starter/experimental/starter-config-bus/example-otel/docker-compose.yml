# Observability backend for starter-config-bus example-otel.
#   app --OTLP/gRPC--> Jaeger (:4317, native OTLP endpoint)
#   app --nats--> NATS (:4222, the refresh transport)
#   app <-scrape-- Prometheus endpoint exposed by the app itself on :9090
services:
  nats:
    image: nats:2.10
    container_name: config-bus-otel-nats
    ports:
      - "127.0.0.1:4222:4222"

  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: config-bus-otel-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - 127.0.0.1:16686:16686
      - 127.0.0.1:4317:4317
