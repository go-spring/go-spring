# One outbox relay draining the shared sqlite database's outbox_message table
# to the in-memory messaging.Driver bean (demoDriver, provided in example.go);
# the outbox starter autowires it as the delivery side, so no driver key is
# needed. Timings are scaled down so the whole scenario settles in seconds.
spring.outbox.instances.main.auto-migrate=true
spring.outbox.instances.main.poll-interval=100ms
spring.outbox.instances.main.max-attempts=3
spring.outbox.instances.main.backoff-base=100ms
spring.outbox.instances.main.backoff-max=500ms
spring.outbox.instances.main.dlq-suffix=.dlq
