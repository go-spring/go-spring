# One outbox relay draining the shared sqlite database's outbox_message table
# to the in-memory "mem" binder (registered in example.go). Timings are scaled
# down from the defaults so the whole scenario settles in a few seconds.
spring.outbox.main.binder=mem
spring.outbox.main.auto-migrate=true
spring.outbox.main.poll-interval=100ms
spring.outbox.main.max-attempts=3
spring.outbox.main.backoff-base=100ms
spring.outbox.main.backoff-max=500ms
spring.outbox.main.dlq-suffix=.dlq
