spring.gorm.sqlserver.instances.load.user=sa
spring.gorm.sqlserver.instances.load.password=RootRoot1
spring.gorm.sqlserver.instances.load.host=127.0.0.1
spring.gorm.sqlserver.instances.load.port=1433
spring.gorm.sqlserver.instances.load.db=master

# Governance rules live in their OWN file, watched live by starter-governance's
# file source. Edit conf/govern.properties while the app runs and the policy
# changes without a restart (and without an app-wide property re-bind).
govern.source.file.path=conf/govern.properties
