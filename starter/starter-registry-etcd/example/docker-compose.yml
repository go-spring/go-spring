services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.13
    container_name: starter-registry-etcd
    ports:
      - "127.0.0.1:2379:2379"
    command:
      - /usr/local/bin/etcd
      - --name
      - node1
      - --advertise-client-urls
      - http://0.0.0.0:2379
      - --listen-client-urls
      - http://0.0.0.0:2379