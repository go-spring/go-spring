spring.app.name=discovery-k8s-example

# One Kubernetes discovery backend declared as the block "main" under
# spring.discovery.k8s, so its bean name is "k8s.main". A client selects it by
# setting its `discovery: k8s.main` field; here the example resolves the "demo"
# Service through it directly (see main.go).

# --- DNS mode (default): headless Service DNS, zero extra dependency, no RBAC.
spring.discovery.k8s.main.mode=dns
spring.discovery.k8s.main.namespace=default
# port-name drives an SRV query (_grpc._tcp.<svc>...), returning address+port.
# Omit it and set `port` instead to use A records with a fixed port.
spring.discovery.k8s.main.port-name=grpc
spring.discovery.k8s.main.cluster-domain=cluster.local
# How often the DNS watcher re-resolves to detect scale changes.
spring.discovery.k8s.main.refresh-interval=5s

# --- EndpointSlice mode (real-time, needs client-go + RBAC). To switch, set:
#   spring.discovery.k8s.main.mode=endpointslice
# In-cluster auth is used when kubeconfig is empty; set it to run out-of-cluster:
#   spring.discovery.k8s.main.kubeconfig=/home/me/.kube/config
#   spring.discovery.k8s.main.resync-period=0

# This backend only *reads* Kubernetes. It contributes no registry, so the
# family-wide registration keys (spring.discovery.service-name / .addr) are not
# set here and must not be: the platform registers every Pod behind a Service.
