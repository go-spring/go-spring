# The governance rules live in their OWN etcd key, watched by
# starter-governance-etcd — nothing under * rides app.properties. This
# block is the entire wiring: it arms the conditional module, whose Source bean
# is injected onto the governance center.
#
# endpoints takes a comma-separated list of cluster nodes, e.g.
#   source.etcd.endpoints=10.0.0.1:2379,10.0.0.2:2379
# Optional keys (defaults shown):
#   source.etcd.dial-timeout=5s
#   source.etcd.username=
#   source.etcd.password=
#   source.etcd.format=        # inferred from the key's extension
source.etcd.endpoints=127.0.0.1:2379
source.etcd.dial-timeout=5s
source.etcd.key=/gs-govern-demo.yaml
