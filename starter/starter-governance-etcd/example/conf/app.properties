# The governance rules live in their OWN etcd key, watched by
# starter-governance-etcd — nothing under govern.* rides app.properties. This
# block is the entire wiring: it arms the conditional module, whose Source bean
# is injected onto the governance center.
govern.source.etcd.endpoint=127.0.0.1:2379
govern.source.etcd.key=/gs-govern-demo.yaml
