# Observability backend + Pulsar for starter-pulsar example-otel.
#   app --Pulsar--> pulsar (standalone)
#   app --OTLP/gRPC--> Jaeger (:4317, native OTLP endpoint)

services:
  pulsar:
    image: apachepulsar/pulsar:3.2.0
    container_name: starter-pulsar
    command: bin/pulsar standalone
    ports:
      - "127.0.0.1:6650:6650"
      - "127.0.0.1:8080:8080"

  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: pulsar-otel-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - 127.0.0.1:16686:16686
      - 127.0.0.1:4317:4317
