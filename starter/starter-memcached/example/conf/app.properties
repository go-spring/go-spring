spring.memcached.cache.servers=127.0.0.1:11211

spring.memcached.session.servers=127.0.0.1:11211

# This instance resolves its server list via service discovery. `servers` is
# omitted on purpose — the list comes from the registered discovery backend
# (see discovery.go). Every instance is assembled through the Driver bean in
# main (AnotherMemcachedDriver), which delegates to the bundled default
# assembly — and that assembly consumes service discovery here.
spring.memcached.discovery.service-name=memcached-cluster

# The discovery backend bean name (a named discovery.Discovery bean
# registered in init) that resolves this instance's service-name.
spring.memcached.discovery.discovery=default
