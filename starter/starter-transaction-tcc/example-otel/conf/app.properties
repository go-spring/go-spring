# starter-transaction-tcc keeps the in-process coordinator on with its defaults.
# Both toggles below are the built-in defaults, shown here for discoverability.
spring.transaction.tcc.enabled=true
spring.transaction.tcc.tracing=true

# With the in-memory default Store a restart loses the log, so recovery is a
# no-op; import a durable-Store starter to make it meaningful.
spring.transaction.tcc.recover-on-start=true

# Observability: OTLP gRPC trace exporter -> Jaeger on :4317.
spring.observability.enable=true
spring.observability.service-name=transaction-tcc-otel-example
spring.observability.trace.exporter=otlp-grpc
spring.observability.trace.endpoint=127.0.0.1:4317
spring.observability.trace.insecure=true
spring.observability.trace.sampler-ratio=1.0

spring.observability.metrics.exporter=prometheus
spring.observability.metrics.port=9090
spring.observability.metrics.path=/metrics
