spring.app.name=discovery-etcd-example

# etcd discovery center, as one named block. Each block becomes a backend bean
# "etcd.<name>" serving both registration (through the cloud/discovery core)
# and discovery (cited by that name).
spring.discovery.etcd.main.endpoints=127.0.0.1:2379
spring.discovery.etcd.main.ttl=10s
spring.discovery.etcd.main.key-prefix=/services/

# The instance identity: shared by every configured discovery center. Setting
# service-name is the registration intent signal.
spring.discovery.service-name=orders
spring.discovery.addr=127.0.0.1:8080
spring.discovery.weight=100
spring.discovery.metadata.zone=cn-north
spring.discovery.metadata.version=v1
