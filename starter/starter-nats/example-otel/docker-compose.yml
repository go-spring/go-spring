# Observability backend for starter-nats example-otel.
#   app --OTLP/gRPC--> Jaeger (:4317, native OTLP endpoint)
#   app --nats--> NATS (:4222, JetStream enabled)

services:
  nats:
    image: nats:2.10
    container_name: nats-otel-nats
    command: ["-js"]
    ports:
      - "127.0.0.1:4222:4222"

  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: nats-otel-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - 127.0.0.1:16686:16686
      - 127.0.0.1:4317:4317
