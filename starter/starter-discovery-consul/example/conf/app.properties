spring.app.name=discovery-consul-example

# Consul agent to register into. Setting the address activates the starter.
spring.discovery.consul.main.address=127.0.0.1:8500
# TTL health check; the starter heartbeats at half this interval.
spring.discovery.consul.main.ttl=10s
spring.discovery.consul.main.deregister-critical-after=30s

# The instance to advertise (backend-agnostic; switching discovery backends is a
# blank-import swap, not a config change).
spring.discovery.service-name=orders
spring.discovery.addr=127.0.0.1:8080
spring.discovery.weight=100
spring.discovery.metadata.zone=cn-north
spring.discovery.metadata.version=v1
