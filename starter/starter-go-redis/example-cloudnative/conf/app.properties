# Disable the built-in HTTP server; probes are served by the actuator.
spring.http.server.enabled=false

# --- Discovery -------------------------------------------------------------
# The "cache" instance's address is resolved through the "default" discovery
# backend (registered in example.go as a static backend pointing at 127.0.0.1:6379)
# rather than hardcoded config — Set/Get succeed only if resolve -> dial works.
spring.go-redis.cache.service-name=redis-cluster
spring.go-redis.cache.discovery=default

# --- Resilience ------------------------------------------------------------
# Backend-neutral config: every redis command runs through the builtin "default"
# executor; a burst over rate-limit is rejected with ErrRateLimited.
govern.enabled=true
govern.driver=default
govern.default.enabled=true
govern.default.rate-limit=5

# --- Health / actuator -----------------------------------------------------
# The per-instance redis health.Indicator is aggregated on :9370.
spring.actuator.enabled=true
spring.actuator.addr=:9370

# --- Dynamic configuration (file-watch) ------------------------------------
spring.config.import=file-watch:./mount/application.properties
