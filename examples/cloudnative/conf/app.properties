# Disable Go-Spring's built-in HTTP server so the gin.Engine bean owns the
# business port (:8081) and the actuator owns the management port (:9370).
spring.http.server.enabled=false

# --- Application host (starter-gin) ----------------------------------------
# The gin app serves the business routes (/ , /greeting, /limited).
spring.gin.server.addr=:8081
# gin's built-in health endpoint is left off so probes are unambiguous: the
# actuator on :9370 owns /health, /readiness and /startup.
spring.gin.server.health.enabled=false

# --- Health / actuator ------------------------------------------------------
# starter-actuator aggregates every health.Indicator bean on its management
# port. /readyz reflects the readiness group; toggling the demo indicator in the
# app flips it between 200 and 503.
spring.actuator.addr=:9370

# --- Dynamic configuration (file-watch) ------------------------------------
# Import the app's config from a watched file. Editing ./mount/application.properties
# the way the kubelet swaps a ConfigMap (atomic ..data symlink) triggers a
# refresh that hot-reloads the bound gs.Dync field. The initial value
# (demo.greeting=hello) is laid down by main() before startup.
spring.config.import=file-watch:./mount/application.properties

