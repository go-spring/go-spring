# The lock instance the demo injects ("autowire:\"demo\""). With
# starter-lock-memory this is the in-process backend; the same shape
# (spring.lock.instances.<backend>.<name>) drives
# starter-lock-redis/-etcd/-consul/-k8s in production.
spring.lock.instances.memory.demo.observe.enabled=true

# The demo is a one-shot runner, not a server; disable the default HTTP server
# so the application exits when the demo pass finishes.
spring.http.server.enabled=false
