# The built-in gs HTTP server the example's HttpServeMux is mounted on.
spring.http.server.addr=:9092

# The local starter in starter.go contributes one in-process session store per
# entry here, exported as a session.SessionStore. A shared backend would be the
# sibling key spring.session.redis.instances.<name> instead.
spring.session.memory.instances.local.clean-interval=1s
