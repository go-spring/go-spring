# Provider (server-role) configuration for the etcd discovery example.

# The built-in HTTP server is disabled so the provider exposes only the Dubbo
# endpoint below.
spring.http.server.enabled=false

# Application identity: becomes dubbo-go's application name and discovery identity.
spring.dubbo.application.name=greet-etcd

# ── Discovery ──────────────────────────────────────────────────────────────────
# Registries are defined once here under ${spring.dubbo.registries}. The map key
# is a logical discovery center ID; `protocol` selects the discovery type. etcdv3 is
# dubbo-go's etcd-v3 driver. The server references it by default (no registry-ids
# set means "publish into every discovery center defined"). Matches docker-compose.yml.
spring.dubbo.registries.etcd.protocol=etcdv3
spring.dubbo.registries.etcd.address=127.0.0.1:2379

# ── Provider (server role) ────────────────────────────────────────────────────
# Triple (protobuf-over-HTTP/2) listener on port 20000.
spring.dubbo.protocols.tri.port=20000
